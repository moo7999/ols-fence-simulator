<title>OLS Fence Simulator</title>
<style>
  :root { --teal:#1F9AA0; --dark:#16454E;
    --bg:#f4f8f9; --panel:#ffffff; --text:#16454E; --muted:#5a6b70; --footer:#7a8a8f; --line:#d7e4e6;
    --bad-bg:#fdecec; --bad-fg:#B2383B; --good-bg:#eaf7ef; --good-fg:#2E8B57; --tile:#EAF5F6; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0e1a1d; --panel:#152a2f; --text:#dceef0; --muted:#9db4b9; --footer:#82989d;
      --line:#24424a; --tile:#1b3238; --bad-bg:#3a1d1f; --bad-fg:#ff9b9e; --good-bg:#16352a; --good-fg:#7fd6a6; }
  }
  :root[data-theme="dark"] { --bg:#0e1a1d; --panel:#152a2f; --text:#dceef0; --muted:#9db4b9; --footer:#82989d;
      --line:#24424a; --tile:#1b3238; --bad-bg:#3a1d1f; --bad-fg:#ff9b9e; --good-bg:#16352a; --good-fg:#7fd6a6; }
  * { box-sizing: border-box; }
  body { font-family:"Segoe UI", Tahoma, "Sakkal Majalla", sans-serif; margin:0; background:var(--bg); color:var(--text); }
  header { background:var(--dark); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:19px; margin:0; font-weight:700; }
  header .sub { font-size:12.5px; opacity:.85; }
  .langbtn { background:#fff; color:var(--dark); border:none; border-radius:8px; padding:7px 16px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
  .wrap { max-width:1250px; margin:14px auto; padding:0 16px; }
  .panel { background:var(--panel); border-radius:14px; padding:16px 18px; box-shadow:0 2px 10px rgba(22,69,78,.08); margin-bottom:12px; }
  .grid { display:flex; gap:18px; flex-wrap:wrap; }
  .ctl { flex:1; min-width:215px; }
  .ctl label { display:block; font-weight:700; margin-bottom:5px; font-size:14.5px; }
  .ctl .val { color:var(--teal); font-weight:700; }
  .ctl input[type=range] { width:100%; accent-color:var(--teal); }
  .ctl input[type=number], .ctl select { width:100%; font-family:inherit; font-size:15px; padding:7px 10px;
    border:1px solid var(--teal); border-radius:8px; color:var(--text); background:var(--panel); }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .verdict { text-align:center; padding:12px; border-radius:12px; font-size:20px; font-weight:800; }
  .bad { background:var(--bad-bg); color:var(--bad-fg); }
  .good { background:var(--good-bg); color:var(--good-fg); }
  .warn { background:rgba(169,122,23,.14); color:var(--warn-fg,#a97a17); }
  .nums { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .num { flex:1; min-width:140px; background:var(--tile); border-radius:10px; padding:9px 10px; text-align:center; }
  .num b { display:block; font-size:18px; }
  .num small { color:var(--muted); font-size:12px; }
  .views { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
  .tab { border:1.5px solid var(--teal); background:var(--panel); color:var(--teal); border-radius:8px; padding:6px 18px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit; }
  .tab.on { background:var(--teal); color:#fff; }
  .viewnote { font-size:12px; color:var(--muted); }
  canvas { width:100%; height:auto; background:#fff; border-radius:10px; touch-action:none; display:block;
    user-select:none; -webkit-user-select:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  .orbit { position:absolute; bottom:12px; inset-inline-end:12px; display:flex; gap:6px; direction:ltr; }
  .orbit button { width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--teal); font-size:17px; font-weight:700; line-height:1; cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.15); touch-action:manipulation; font-family:inherit; }
  .orbit button:hover { background:var(--teal); color:#fff; }
  :root[data-theme="dark"] canvas, body.darkcanvas canvas {}
  summary.bsum { cursor:pointer; font-weight:800; font-size:16.5px; color:var(--teal); }
  textarea.bdata { width:100%; font-family:Consolas,monospace; font-size:13px; padding:8px 10px;
    border:1px solid var(--teal); border-radius:8px; background:var(--panel); color:var(--text); direction:ltr; resize:vertical; }
  .bbtns { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .btab { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:10px; }
  .btab th, .btab td { border:1px solid var(--line); padding:6px 9px; text-align:center; white-space:nowrap; }
  .btab th { background:var(--tile); font-size:12.5px; }
  .btab tbody tr { cursor:pointer; }
  .btab tbody tr:hover { background:var(--tile); }
  .btab tbody tr.sel { background:var(--tile); font-weight:700; }
  .cell-ok { color:var(--good-fg); font-weight:700; }
  .cell-bad { color:var(--bad-fg); font-weight:700; }
  .cell-warn { color:var(--warn-fg,#a97a17); font-weight:700; }
  :root[data-theme="dark"] { --warn-fg:#e3b65a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --warn-fg:#e3b65a; } }
  .trio { display:flex; gap:6px; }
  footer { text-align:center; color:var(--footer); font-size:12.5px; padding:8px 14px 22px; line-height:1.7; }
  .credit { margin-top:6px; opacity:.85; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="t_title"></h1>
    <span class="sub" id="t_sub"></span>
  </div>
  <button class="langbtn" id="langbtn" onclick="toggleLang()">English</button>
</header>

<div class="wrap">
  <div class="panel">
    <div class="grid">
      <div class="ctl">
        <label id="l_cl"></label>
        <input type="number" id="cl" step="0.01" value="100.00">
        <div class="hint" id="h_cl"></div>
      </div>
      <div class="ctl">
        <label id="l_g"></label>
        <input type="number" id="g" step="0.01" value="101.20">
        <div class="hint" id="h_g"></div>
      </div>
      <div class="ctl">
        <label id="l_strip"></label>
        <select id="strip">
          <option value="140">140</option>
          <option value="150" selected>150</option>
          <option value="75">75</option>
          <option value="70">70</option>
          <option value="40">40</option>
          <option value="30">30</option>
          <option value="custom" id="opt_custom"></option>
        </select>
        <input type="number" id="stripCustom" step="1" value="150" style="display:none; margin-top:6px">
        <div class="hint" id="h_strip"></div>
      </div>
      <div class="ctl">
        <label id="l_slope"></label>
        <select id="slope">
          <option value="7" selected>14.3% (1:7)</option>
          <option value="5">20% (1:5)</option>
        </select>
        <div class="hint" id="h_slope"></div>
      </div>
    </div>
    <div class="grid" style="margin-top:12px">
      <div class="ctl">
        <label><span id="l_d"></span> <span class="val" id="dVal"></span></label>
        <input type="range" id="dist" min="0" max="600" step="0.5" value="152">
        <input type="number" id="distNum" step="1" min="0" max="8000" value="152" style="margin-top:6px">
        <div class="hint" id="h_dnum"></div>
      </div>
      <div class="ctl">
        <label><span id="l_h"></span> <span class="val" id="hVal"></span></label>
        <input type="range" id="hgt" min="0.5" max="30" step="0.1" value="2.5">
        <select id="otype" style="margin-top:6px">
          <option value="fence" id="opt_f" selected></option>
          <option value="crane" id="opt_cr"></option>
        </select>
      </div>
    </div>
    <div class="grid" style="margin-top:12px">
      <div class="ctl">
        <label id="l_ihh"></label>
        <input type="number" id="ihh" step="1" min="10" max="150" value="45">
        <div class="hint" id="h_ihh"></div>
      </div>
      <div class="ctl">
        <label id="l_ihe"></label>
        <input type="number" id="ihe" step="50" min="1000" max="10000" value="4000">
        <div class="hint" id="h_ihe"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="verdict" id="verdict"></div>
    <div class="nums">
      <div class="num"><small id="n1"></small><b id="nCL"></b></div>
      <div class="num"><small id="n2"></small><b id="nG"></b></div>
      <div class="num"><small id="n3"></small><b id="nTop"></b></div>
      <div class="num"><small id="n4"></small><b id="nAllow"></b></div>
      <div class="num"><small id="n5"></small><b id="nPen"></b></div>
      <div class="num"><small id="n6"></small><b id="nMin"></b></div>
    </div>
  </div>

  <div class="panel">
    <div class="views">
      <button class="tab on" id="tab3d" onclick="setView('3d')"></button>
      <button class="tab" id="tab2d" onclick="setView('2d')"></button>
      <span class="viewnote" id="viewnote"></span>
    </div>
    <div style="position:relative">
      <canvas id="cv" width="1180" height="560"></canvas>
      <div id="orbit" class="orbit">
        <button type="button" data-act="left" title="&#8634;">&#10554;</button>
        <button type="button" data-act="right" title="&#8635;">&#10555;</button>
        <button type="button" data-act="up">&#9650;</button>
        <button type="button" data-act="down">&#9660;</button>
        <button type="button" data-act="in">&#65291;</button>
        <button type="button" data-act="out">&#65293;</button>
        <button type="button" data-act="reset">&#8962;</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <details id="batchBox">
      <summary class="bsum" id="b_title"></summary>
      <div class="hint" id="b_intro" style="margin:8px 0 12px"></div>
      <div class="grid" style="margin-bottom:10px">
        <div class="ctl" style="flex:1.4">
          <label id="b_l_apt"></label>
          <select id="aptSel" onchange="aptPick()"></select>
          <div class="hint" id="b_h_apt"></div>
        </div>
        <div class="ctl">
          <label id="b_l_rwy"></label>
          <select id="rwySel" onchange="rwyPick()"></select>
          <div class="hint" id="aptNote" style="color:var(--warn-fg,#a97a17); font-weight:700"></div>
        </div>
      </div>
      <div class="grid">
        <div class="ctl">
          <label id="b_l_thrA"></label>
          <div class="trio">
            <input type="text" id="aE" inputmode="decimal" placeholder="E" style="direction:ltr">
            <input type="text" id="aN" inputmode="decimal" placeholder="N" style="direction:ltr">
            <input type="number" id="aZ" step="0.01" placeholder="Z">
          </div>
          <div class="hint" id="b_h_thrA"></div>
        </div>
        <div class="ctl">
          <label id="b_l_thrB"></label>
          <div class="trio">
            <input type="text" id="bE" inputmode="decimal" placeholder="E" style="direction:ltr">
            <input type="text" id="bN" inputmode="decimal" placeholder="N" style="direction:ltr">
            <input type="number" id="bZ" step="0.01" placeholder="Z">
          </div>
          <div class="hint" id="b_h_thrB"></div>
        </div>
        <div class="ctl">
          <label id="b_l_hdef"></label>
          <input type="number" id="bH" step="0.1" min="0" max="300" value="2.5">
          <div class="hint" id="b_h_hdef"></div>
        </div>
      </div>
      <div class="ctl" style="margin-top:12px; min-width:0">
        <label id="b_l_data"></label>
        <textarea id="bData" class="bdata" rows="7" placeholder="1, 500182.00, 100400.00, 251.10&#10;2, 500182.00, 100900.00, 252.90, 3.0"></textarea>
        <div class="hint" id="b_h_data"></div>
        <div class="bbtns">
          <input type="file" id="bFile" accept=".csv,.txt,.tsv,.xlsx,.docx,text/plain,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none">
          <button type="button" class="tab" id="b_file" onclick="document.getElementById('bFile').click()"></button>
          <button type="button" class="tab on" id="b_run" onclick="runBatch()"></button>
          <button type="button" class="tab" id="b_sample" onclick="loadSample()"></button>
          <button type="button" class="tab" id="b_csvbtn" onclick="exportBatch()" style="display:none"></button>
          <button type="button" class="tab" id="b_clearbtn" onclick="clearBatch()" style="display:none"></button>
        </div>
      </div>
      <div id="bSummary" class="verdict" style="display:none; margin-top:12px; font-size:16px"></div>
      <div class="hint" id="b_click" style="display:none; margin-top:8px"></div>
      <div id="bTableWrap" style="overflow-x:auto"></div>
    </details>
  </div>
</div>

<footer>
  <span id="f_scope" style="font-weight:700"></span><br>
  <span id="f_rule"></span><br>
  <span id="f_disc"></span>
  <div class="credit" id="f_credit"></div>
</footer>

// ================= model =================
function params(){
  const cl = parseFloat(document.getElementById('cl').value) || 0;
  const g  = parseFloat(document.getElementById('g').value) || 0;
  const sSel = document.getElementById('strip').value;
  const strip = sSel==='custom' ? (parseFloat(document.getElementById('stripCustom').value)||150)
                                : parseFloat(sSel);
  const slope = parseFloat(document.getElementById('slope').value);
  const d = parseFloat(document.getElementById('distNum').value) || 0;
  const H = parseFloat(document.getElementById('hgt').value);
  const ihH = parseFloat(document.getElementById('ihh').value) || 45;
  const ihEnd = parseFloat(document.getElementById('ihe').value) || 4000;
  const otype = document.getElementById('otype').value;
  return {cl,g,strip,slope,d,H, top:g+H, ihH, ihEnd, conS:20, conRise:100, otype};
}
// lateral OLS profile: transitional (1:slope) capped by the inner horizontal (ihH),
// then conical at 5% (1:20) from ihEnd rising conRise metres
function surfParts(p){
  return { tEnd: p.strip + p.slope*p.ihH, ihEnd: p.ihEnd, conTop: p.ihH + p.conRise,
           conEnd: p.ihEnd + p.conS*p.conRise };
}
function allowRelAt(p, d){            // allowed height above CL reference at lateral distance d
  if (d < p.strip) return NaN;
  const sp = surfParts(p);
  let h = Math.min((d - p.strip)/p.slope, p.ihH);
  if (d > sp.ihEnd) h = Math.min(p.ihH + (d - sp.ihEnd)/p.conS, sp.conTop);
  return h;
}
function surfNameAt(p, d, t){
  const sp = surfParts(p);
  if (d <= sp.tEnd) return t.sfT;
  if (d <= sp.ihEnd) return t.sfIH;
  return t.sfCon;
}
function evaluate(p){
  const inside = p.d < p.strip;
  const allow = inside ? NaN : p.cl + allowRelAt(p, p.d);
  const pen = inside ? Infinity : p.top - allow;
  const sp = surfParts(p);
  const relTop = p.top - p.cl;
  let dmin;
  if (relTop <= 0) dmin = p.strip;
  else if (relTop <= p.ihH) dmin = p.strip + p.slope*relTop;
  else if (relTop <= sp.conTop) dmin = sp.ihEnd + p.conS*(relTop - p.ihH);
  else dmin = Infinity;
  return {inside, allow, pen, dmin};
}
// ====== surfaces beyond the thresholds — Annex 14 Vol I Tables 4-1 & 4-2, instrument runways code 3/4 ======
// Approach (precision CAT I / non-precision): inner edge 280 m at 60 m from THR, 15% divergence,
// 3000 m at 2%, 3600 m at 2.5%, then horizontal at 150 m above THR, 15 000 m total.
// Take-off climb: inner edge 180 m at 60 m from the runway end, 12.5% divergence to 1200 m, 2%, 15 000 m.
const APP = { inner:140, dist:60, div:0.15, s1:3000, g1:0.02, s2:3600, g2:0.025, cap:150, total:15000 };
const TOC = { inner:90,  dist:60, div:0.125, half:600, g:0.02, total:15000 };
// x: metres beyond the threshold along the extended centreline; dAbs: lateral offset from it;
// thrZ: that end's threshold elevation. The approach datum is the THR elevation, and the take-off
// climb datum is approximated by the same elevation (clearway NIL). Inner horizontal and conical
// wrap the end radially from the threshold point. Returns the lowest covering surface, or null.
function beyondAllowed(p, x, dAbs, thrZ){
  const cands = [], u = x - APP.dist;
  if (u >= 0 && u <= APP.total){
    const zApp = thrZ + Math.min(APP.g1*Math.min(u, APP.s1) + APP.g2*Math.max(0, Math.min(u - APP.s1, APP.s2)), APP.cap);
    const halfA = APP.inner + APP.div*u;
    if (dAbs <= halfA) cands.push([zApp, 'sfApp']);
    else {
      const zTr = zApp + (dAbs - halfA)/p.slope;      // transitional flank of the approach surface
      if (zTr < thrZ + p.ihH) cands.push([zTr, 'sfT']);
    }
    const halfT = Math.min(TOC.inner + TOC.div*u, TOC.half);
    if (dAbs <= halfT) cands.push([thrZ + TOC.g*u, 'sfToc']);
  }
  const r = Math.hypot(x, dAbs);                       // racetrack arcs about the threshold
  if (r <= p.ihEnd) cands.push([thrZ + p.ihH, 'sfIH']);
  else if (r <= p.ihEnd + p.conS*p.conRise) cands.push([thrZ + p.ihH + (r - p.ihEnd)/p.conS, 'sfCon']);
  if (!cands.length) return null;
  cands.sort((a,b)=>a[0]-b[0]);
  return { allow: cands[0][0], sf: cands[0][1] };
}

function ll2utm(lat, lon, forceZone){

  const e4=e2*e2, e6=e4*e2;

  const E=k0*N*(A+(1-T+C)*A*A*A/6+(5-18*T+T*T+72*C-58*ep2)*Math.pow(A,5)/120)+500000;
  const Nn=k0*(M+N*tn*(A*A/2+(5-T+9*C+4*C*C)*Math.pow(A,4)/24+(61-58*T+T*T+600*C-330*ep2)*Math.pow(A,6)/720));
  return {E, N:Nn, zone};
}

function parseGeoLine(line){

    if (used[i]) continue;
    let m, letter=null, nums=[], lo=i, hi=i;

      letter=m[1].toUpperCase(); nums=[parseFloat(m[2])]; used[i]=true;
      if (!m[2].includes('.')){                      // integer degrees: minutes/seconds may follow
        let j=i+1;

          nums.push(parseFloat(toks[j])); used[j]=true; hi=j; j++;

          pre.unshift(parseFloat(toks[j])); used[j]=true; lo=j;
        }
      }
      nums = pre.concat([parseFloat(m[1])]);
      if (pre.length===1){ nums=[pre[0]+parseFloat(m[1])/60]; }            // D M.m form
      else if (pre.length===0){ nums=[parseFloat(m[1])]; }                 // decimal degrees
      else { nums=[pre[0], pre[1], parseFloat(m[1])]; }
    } else continue;
    const val = nums.length===3 ? nums[0]+nums[1]/60+nums[2]/3600
              : nums.length===2 ? nums[0]+nums[1]/60 : nums[0];
    const signed = (letter==='S'||letter==='W') ? -val : val;

}

function parseAngleStr(sraw){

            : nums.length===2 ? nums[0]+nums[1]/60 : nums[0];
  const signed = (letter==='S'||letter==='W') ? -val : val;
  if (Math.abs(signed) > 180) return null;
  return { val: signed, isLat: (letter==='N'||letter==='S') };

function exportBatch(){
  if (!batchRows) return;
  const lines = ['id,dist_CL_m,station_m,CL_elev_m,surface_rank,allowed_elev_m,top_elev_m,margin_m,verdict'];
  const sfMap = { sfApp:'approach', sfToc:'take_off_climb', sfT:'transitional', sfIH:'inner_horizontal', sfCon:'conical' };
  for (const r of batchRows){
    let v = r.nocov ? 'NO_COVERAGE' : (r.e.inside ? 'INSIDE_STRIP' : (r.e.pen>0 ? 'PENETRATES' : 'OK'));
    if (r.outside && !r.nocov) v = 'BEYOND_THR+'+v;
    const sp2 = surfParts(r.q), blank = r.nocov || r.e.inside;
    const sName = blank ? '' : (r.sf ? sfMap[r.sf] : (r.d<=sp2.tEnd ? 'transitional' : (r.d<=sp2.ihEnd ? 'inner_horizontal' : 'conical')));
    lines.push([r.pt.id, r.d.toFixed(2), r.s.toFixed(1), r.clz.toFixed(2), sName,
      blank?'':r.e.allow.toFixed(2), r.q.top.toFixed(2), blank?'':(-r.e.pen).toFixed(2), v].join(','));
  }
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'ols-batch-results.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

let view = '3d';
function setView(v){
  view = v;

function fmt(v){ return v.toFixed(2) + T().m; }

function update(){
  const t = T(), p = params(), e = evaluate(p);
  document.getElementById('dVal').textContent = p.d.toFixed(1)+t.m;
  document.getElementById('hVal').textContent = p.H.toFixed(1)+t.m;
  document.getElementById('nCL').textContent = fmt(p.cl);
  document.getElementById('nG').textContent = fmt(p.g);
  document.getElementById('nTop').textContent = fmt(p.top);
  document.getElementById('nAllow').textContent = e.inside ? t.inside : fmt(e.allow);
  document.getElementById('nPen').textContent = e.inside ? '—' : (e.pen>0 ? t.pen+fmt(e.pen) : t.marg+fmt(-e.pen));
  document.getElementById('nMin').textContent = isFinite(e.dmin) ? e.dmin.toFixed(1)+t.m : t.never;
  const v = document.getElementById('verdict');
  const sName = e.inside ? '' : surfNameAt(p, p.d, t);
  if (e.inside){ v.className='verdict bad'; v.textContent = t.v_inside; }
  else if (!isFinite(e.dmin) && e.pen > 0){ v.className='verdict bad'; v.textContent = '✗ ' + t.v_never; }
  else if (e.pen > 0){ v.className='verdict bad'; v.textContent = t.v_pen.replace('{s}', sName).replace('{x}', e.pen.toFixed(2)); }
  else { v.className='verdict good'; v.textContent = t.v_ok.replace('{s}', sName).replace('{x}', (-e.pen).toFixed(2)); }
  document.getElementById('viewnote').textContent = (view==='3d') ? t.note3d : t.note2d;
  // selected batch point beyond the thresholds: the card mirrors that row's own surface verdict,
  // so the card and the results table always agree
  if (batchRows && batchSel >= 0){
    const r = batchRows[batchSel];
    if ((r.sf || r.nocov) && Math.abs(p.d - r.d) < 0.01 && Math.abs(p.g - r.pt.Z) < 0.01){
      document.getElementById('nTop').textContent = fmt(r.q.top);
      document.getElementById('nAllow').textContent = r.nocov ? '—' : fmt(r.e.allow);
      document.getElementById('nPen').textContent = r.nocov ? '—' : (r.e.pen > 0 ? t.pen + fmt(r.e.pen) : t.marg + fmt(-r.e.pen));
      document.getElementById('nMin').textContent = '—';
      if (r.nocov){ v.className = 'verdict warn'; v.textContent = t.b_nocov; }
      else if (r.e.pen > 0){ v.className = 'verdict bad'; v.textContent = t.v_pen.replace('{s}', t[r.sf]).replace('{x}', r.e.pen.toFixed(2)); }
      else { v.className = 'verdict good'; v.textContent = t.v_ok.replace('{s}', t[r.sf]).replace('{x}', (-r.e.pen).toFixed(2)); }
      document.getElementById('viewnote').textContent = t.note_bey.replace('{s}', r.nocov ? '—' : t[r.sf]);
    }
  }
  lastP=p; lastE=e;
  if (view==='3d') draw3d(p,e); else draw2d(p,e);
}

// ================= colors =================
const C = {
  sand:'#E4D5B0', sandEdge:'#8a6f3f', rwy:'#4a4a4a', cline:'#ffffff',
  strip:'rgba(31,154,160,.12)', stripEdge:'#1F9AA0',
  surf:'rgba(90,110,115,.30)', surfEdge:'#16454E', forb:'rgba(154,167,170,.14)',
  bad:'#B2383B', good:'#2E8B57', sky:'#eef6f8', label:'#16454E'
};

// ================= 2D =================
function draw2d(p,e){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const W=cv.width, Hc=cv.height;
  ctx.clearRect(0,0,W,Hc);
  ctx.fillStyle=C.sky; ctx.fillRect(0,0,W,Hc);
  const sp = surfParts(p);
  const dminX = isFinite(e.dmin) ? e.dmin+40 : 0;
  const xmax = Math.max(p.strip+120, p.d+60, dminX, 260);
  const relG = p.g - p.cl;
  const ymin = Math.min(-2, relG-2), ymax = Math.max(10, relG+p.H+4, allowRelAt(p, xmax)+2);
  const rtl = (T().dir==='rtl');
  const x0=50, x1=W-30;
  const X = m => rtl ? x1-(m/xmax)*(x1-x0) : x0+(m/xmax)*(x1-x0);
  const yB=Hc-55, yT=25;
  const Y = el => yB-((el-ymin)/(ymax-ymin))*(yB-yT);
  // ground profile: 0 at runway, ramp 45..75 to relG, flat beyond
  ctx.fillStyle=C.sand; ctx.beginPath();
  ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(45),Y(0)); ctx.lineTo(X(75),Y(relG)); ctx.lineTo(X(xmax),Y(relG));
  ctx.lineTo(X(xmax),yB); ctx.lineTo(X(0),yB); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=C.sandEdge; ctx.lineWidth=2; ctx.beginPath();
  ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(45),Y(0)); ctx.lineTo(X(75),Y(relG)); ctx.lineTo(X(xmax),Y(relG)); ctx.stroke();
  // runway
  ctx.fillStyle=C.rwy; const xr0=X(0), xr1=X(23);
  ctx.fillRect(Math.min(xr0,xr1), Y(0)-4, Math.abs(xr1-xr0), 6);
  // strip zone + edge
  ctx.fillStyle=C.strip;
  const xs0=X(0), xs1=X(p.strip);
  ctx.fillRect(Math.min(xs0,xs1), yT, Math.abs(xs1-xs0), yB-yT);
  ctx.strokeStyle=C.stripEdge; ctx.setLineDash([7,5]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(X(p.strip),yT); ctx.lineTo(X(p.strip),yB); ctx.stroke(); ctx.setLineDash([]);
  // forbidden airspace above the piecewise surface profile
  const prof=[[p.strip,0]];
  if (xmax > sp.tEnd) prof.push([sp.tEnd, p.ihH]);
  if (xmax > sp.ihEnd) prof.push([sp.ihEnd, p.ihH]);
  if (xmax > sp.conEnd) prof.push([sp.conEnd, sp.conTop]);
  prof.push([xmax, allowRelAt(p, xmax)]);
  ctx.fillStyle=C.forb; ctx.beginPath();
  ctx.moveTo(X(prof[0][0]),Y(prof[0][1]));
  for(let i=1;i<prof.length;i++) ctx.lineTo(X(prof[i][0]),Y(prof[i][1]));
  ctx.lineTo(X(xmax),yT); ctx.lineTo(X(p.strip),yT); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=C.surfEdge; ctx.lineWidth=3; ctx.beginPath();
  ctx.moveTo(X(prof[0][0]),Y(prof[0][1]));
  for(let i=1;i<prof.length;i++) ctx.lineTo(X(prof[i][0]),Y(prof[i][1]));
  ctx.stroke();
  // object: fence bar or crane glyph
  const ok = !e.inside && e.pen<=0;
  const oc = ok?C.good:C.bad;
  ctx.fillStyle = oc; ctx.strokeStyle = oc;
  const fx=X(p.d);
  if (p.otype==='crane'){
    const yb2=Y(relG), yt2=Y(relG+p.H), ym=Y(relG+p.H*0.74);
    ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(fx,yb2); ctx.lineTo(fx,ym); ctx.stroke();      // mast
    const rtlDir = (T().dir==='rtl') ? 1 : -1;                                                   // jib toward runway
    const jpx = 26, cpx = 10;
    ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(fx - rtlDir*cpx, ym); ctx.lineTo(fx + rtlDir*jpx, ym); ctx.stroke();
    ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(fx,yt2); ctx.lineTo(fx + rtlDir*jpx, ym); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx,yt2); ctx.lineTo(fx - rtlDir*cpx, ym); ctx.stroke();
    ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(fx,ym); ctx.lineTo(fx,yt2); ctx.stroke();      // apex
  } else {
    const half=5;
    ctx.fillRect(fx-half, Y(relG+p.H), 2*half, Math.max(2, Y(relG)-Y(relG+p.H)));
  }
  // labels
  const t=T();
  ctx.fillStyle=C.label; ctx.font='bold 14px Tahoma'; ctx.textAlign='center';
  ctx.fillText(t.rwy, X(11), Y(0)+22);
  ctx.fillText(String(p.strip), X(p.strip), yB+20);
  ctx.fillText('0', X(0), yB+20);
  ctx.fillText(p.d.toFixed(0), fx, yB+36);
  ctx.save(); ctx.fillStyle=C.surfEdge; ctx.font='bold 13px Tahoma';
  const lx = p.strip+(xmax-p.strip)*0.55;
  ctx.fillText(surfNameAt(p, lx, t), X(lx), Y(allowRelAt(p, lx))-12);
  ctx.restore();
  ctx.fillStyle= ok?C.good:C.bad; ctx.fillRect(fx-12, yB+24, 24, 3);
}

// ================= 3D =================
const ANIM0 = performance.now();
let lastP=null, lastE=null;
const cam = { mode:'orbit', yaw:-0.78, pitch:0.52, dist:860, f:900,
              wx:0, wz:0, wyaw:1.5708, wpitch:0.06 };
const YEX = 4; // vertical exaggeration
const NEAR = 8;
const LIGHT = (()=>{ const l=[-0.45,0.85,0.30]; const n=Math.hypot(l[0],l[1],l[2]); return [l[0]/n,l[1]/n,l[2]/n]; })();
const SKY_TOP=[176,212,226], SKY_HOR=[236,243,246];

function draw3d(p,e){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const W=cv.width, Hc=cv.height;
  const ols = surfParts(p);
  const dShow = Math.min(p.d, 560);                    // 3D frame clamp; values stay exact
  const farClip = p.d > 560;
  const xmax = Math.max(p.strip+120, dShow+60, 260);
  const relG = p.g - p.cl;
  const Zl = 260;          // runway / fence / surface length
  const Zt = 470;          // terrain length
  const Xf = 300;          // terrain side extension
  const cx = xmax*0.45, cy2=(relG+p.H)*YEX*0.4, cz=0;
  const groundAt = x => (x<=45?0 : x>=75?relG : relG*(x-45)/30);
  const eyeY = groundAt(cam.wx)*YEX + 1.7*YEX;

  // sky
  const sg = ctx.createLinearGradient(0,0,0,Hc);
  sg.addColorStop(0, `rgb(${SKY_TOP.join(',')})`); sg.addColorStop(0.62, `rgb(${SKY_HOR.join(',')})`);
  sg.addColorStop(1, 'rgb(224,216,194)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,Hc);

  const walk = cam.mode==='walk';
  const yawA = walk?cam.wyaw:cam.yaw, pitA = walk?cam.wpitch:cam.pitch;
  const cyw=Math.cos(yawA), syw=Math.sin(yawA), cp=Math.cos(pitA), sp=Math.sin(pitA);
  function toCam(x,y,z){
    const X0 = x-(walk?cam.wx:cx), Y0 = y*YEX-(walk?eyeY:cy2), Z0 = z-(walk?cam.wz:cz);
    const x1=X0*cyw - Z0*syw, z1=X0*syw + Z0*cyw;
    const y2=Y0*cp + z1*sp, z2=z1*cp - Y0*sp;
    return [x1, y2, z2 + (walk?0:cam.dist)];
  }
  function toScr(c){ const sc=cam.f/c[2]; return [W/2+c[0]*sc, Hc/2-c[1]*sc, c[2]]; }
  function clipPoly(pts){
    const out=[], n=pts.length;
    for(let i=0;i<n;i++){
      const A=pts[i], B=pts[(i+1)%n], ain=A[2]>NEAR, bin=B[2]>NEAR;
      if(ain) out.push(A);
      if(ain!==bin){ const t=(NEAR-A[2])/(B[2]-A[2]);
        out.push([A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, NEAR+0.01]); }
    }
    return out;
  }
  function fog(zc){ return Math.min(0.8, Math.max(0, (zc-470)/1350)); }
  function shadeFog(base, n, zc){
    const dt = Math.max(0, n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2]);
    const k = 0.58 + 0.42*dt;
    let c = [base[0]*k, base[1]*k, base[2]*k];
    const t = fog(zc);
    return c.map((v,i)=>Math.round(v+(SKY_HOR[i]-v)*t));
  }
  function quad(a,b,c,d, base, alpha, edge, lw){
    const poly = clipPoly([toCam(...a),toCam(...b),toCam(...c),toCam(...d)]);
    if(poly.length<3) return;
    const u=[b[0]-a[0],(b[1]-a[1])*YEX,b[2]-a[2]], v=[d[0]-a[0],(d[1]-a[1])*YEX,d[2]-a[2]];
    let n=[u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]];
    const nl=Math.hypot(n[0],n[1],n[2])||1; n=n.map(x=>x/nl); if(n[1]<0) n=n.map(x=>-x);
    let zc=0; const S=poly.map(c2=>{ zc+=c2[2]; return toScr(c2); }); zc/=poly.length;
    ctx.beginPath(); ctx.moveTo(S[0][0],S[0][1]);
    for(let i=1;i<S.length;i++) ctx.lineTo(S[i][0],S[i][1]);
    ctx.closePath();
    ctx.globalAlpha=(alpha==null?1:alpha);
    ctx.fillStyle=`rgb(${shadeFog(base,n,zc).join(',')})`; ctx.fill(); ctx.globalAlpha=1;
    if(edge){ ctx.strokeStyle=edge; ctx.lineWidth=lw||1.2; ctx.stroke(); }
  }
  function line(a,b, col, lw, dash){
    let A=toCam(...a), B=toCam(...b);
    if(A[2]<=NEAR && B[2]<=NEAR) return;
    if(A[2]<=NEAR || B[2]<=NEAR){
      const t=(NEAR+0.01-A[2])/(B[2]-A[2]);
      const M=[A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, NEAR+0.01];
      if(A[2]<=NEAR) A=M; else B=M;
    }
    const As=toScr(A), Bs=toScr(B);
    if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(As[0],As[1]); ctx.lineTo(Bs[0],Bs[1]);
    ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke(); ctx.setLineDash([]);
  }
  function P3(x,y,z){ const c=toCam(x,y,z); if(c[2]<NEAR+5) return null; return toScr(c); }

  // ---- 0a. horizon band: ground colour from the true horizon down ----
  (function(){
    const R=60000, ox=walk?cam.wx:cx, oz=walk?cam.wz:cz; let yh=null;
    for(let a2=0;a2<6.3;a2+=0.25){
      const c2=toCam(ox+R*Math.cos(a2), 0, oz+R*Math.sin(a2));
      if(c2[2]>1000){ const y=toScr(c2)[1]; yh=(yh==null)?y:Math.min(yh,y); }
    }
    if(yh==null || yh>=Hc-1) return;
    yh=Math.max(0,yh);
    const near=[212,198,163];
    const far = near.map((v,i)=>Math.round(v+(SKY_HOR[i]-v)*0.8));
    const gg=ctx.createLinearGradient(0,yh,0,Hc);
    gg.addColorStop(0,`rgb(${far.join(',')})`);
    gg.addColorStop(0.3,`rgb(${near.join(',')})`);
    gg.addColorStop(1,`rgb(${near.map(v=>Math.round(v*0.97)).join(',')})`);
    ctx.fillStyle=gg; ctx.fillRect(0,yh-0.5,W,Hc-yh+0.5);
  })();
  // ---- 0b. silhouette skirt: fill below the terrain outline (aerial angles) ----
  (function(){
    const C=[toCam(-40-Xf,0,-Zt),toCam(-40-Xf,0,Zt),toCam(xmax+Xf,relG,Zt),toCam(xmax+Xf,relG,-Zt)];
    if(C.some(c2=>c2[2]<NEAR+2)) return;
    const S=C.map(toScr);
    const yTop=Math.max(0,Math.min(...S.map(P=>P[1])));
    const near=[212,198,163];
    const far = near.map((v,i)=>Math.round(v+(SKY_HOR[i]-v)*0.8));
    const gg=ctx.createLinearGradient(0,yTop,0,Hc);
    gg.addColorStop(0,`rgb(${far.join(',')})`);
    gg.addColorStop(0.3,`rgb(${near.join(',')})`);
    gg.addColorStop(1,`rgb(${near.map(v=>Math.round(v*0.97)).join(',')})`);
    ctx.fillStyle=gg;
    for(let i=0;i<4;i++){
      const A=S[i], B=S[(i+1)%4];
      ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]);
      ctx.lineTo(B[0],Hc+60); ctx.lineTo(A[0],Hc+60); ctx.closePath(); ctx.fill();
    }
  })();

  // ---- 1. terrain strips ----
  const STEP=47;
  const cols=[[-40-Xf,-40,0,0],[-40,45,0,0],[45,75,0,relG],[75,xmax,relG,relG],[xmax,xmax+Xf,relG,relG]];
  for(let z=-Zt; z<Zt; z+=STEP){
    const even = (Math.round(z/STEP)%2===0);
    const sand = even ? [227,212,175] : [221,205,166];
    for(const [xa,xb,ya,yb] of cols)
      quad([xa,ya,z],[xb,yb,z],[xb,yb,z+STEP],[xa,ya,z+STEP], sand);
  }
  // ---- 2. runway slab + markings ----
  quad([-23,0.02,-Zl],[23,0.02,-Zl],[23,0.02,Zl],[-23,0.02,Zl], [62,64,66]);
  line([-21.5,0.05,-Zl],[-21.5,0.05,Zl], 'rgba(245,245,245,.85)', 2);
  line([ 21.5,0.05,-Zl],[ 21.5,0.05,Zl], 'rgba(245,245,245,.85)', 2);
  for(let z=-Zl+52; z<Zl-52; z+=42) line([0,0.05,z],[0,0.05,z+21], 'rgba(250,250,250,.92)', 3);
  for(const ze of [[-Zl+10,-Zl+42],[Zl-42,Zl-10]]){
    for(let i=0;i<8;i++){ const x=-18.5+i*5.3;
      quad([x,0.04,ze[0]],[x+2.6,0.04,ze[0]],[x+2.6,0.04,ze[1]],[x,0.04,ze[1]], [235,235,235]); }
  }
  // ---- 3. strip edge (dashed teal) ----
  for(let z=-Zl; z<Zl; z+=26) line([p.strip,0.06,z],[p.strip,0.06,z+13], '#1F9AA0', 2.4);
  // ---- 4. fence shadow then fence (single object, or the full batch fence) ----
  const hasBatch = !!(batchRows && batchRows.length);
  const okAll = hasBatch ? batchRows.every(r=>!r.e.inside && r.e.pen<=0) : (!e.inside && e.pen<=0);
  const ok = !e.inside && e.pen<=0;
  const z0=-Zl*0.92, z1=Zl*0.92;
  if (hasBatch){
    // map real stations onto the scene runway — beyond-threshold stations extend past the slab, clamped to the terrain
    const zOf = s => Math.max(-(Zt-14), Math.min(Zt-14, z1 - (s/Math.max(batchL,1))*(z1-z0)));
    const BP = batchRows.map(r=>({ x:Math.min(r.d, 540), z: zOf(r.s),
      y0:r.relg, y1:r.relg + r.H, bad:(r.e.inside || r.e.pen>0), out:r.nocov }));
    for(let i=0;i<BP.length-1;i++){
      const a=BP[i], b=BP[i+1], bad=a.bad||b.bad;
      const col = bad ? [178,56,59] : [46,139,87];
      const lc  = bad ? 'rgba(125,38,41,.95)' : 'rgba(30,96,60,.95)';
      quad([a.x,a.y0+0.01,a.z],[a.x+6,a.y0+0.01,a.z],[b.x+6,b.y0+0.01,b.z],[b.x,b.y0+0.01,b.z],[120,112,92],0.28);
      quad([a.x,a.y0,a.z],[a.x,a.y1,a.z],[b.x,b.y1,b.z],[b.x,b.y0,b.z], col, 0.42);
      line([a.x,a.y1,a.z],[b.x,b.y1,b.z], lc, 2.6);
      line([a.x,a.y0,a.z],[b.x,b.y0,b.z], lc, 1.6);
      line([a.x,a.y1+0.14,a.z],[b.x,b.y1+0.14,b.z], '#53585c', 1.4, [5,4]);
    }
    for(let i=0;i<BP.length;i++){
      const b=BP[i], r=batchRows[i], sel=(i===batchSel);
      const pc = b.bad ? 'rgba(125,38,41,.98)' : (b.out ? 'rgba(169,122,23,.98)' : 'rgba(30,96,60,.98)');
      line([b.x,b.y0,b.z],[b.x,b.y1,b.z], pc, sel?5:3);
    }
  } else {
  const shW = Math.min(14, p.H*2.2);
  quad([dShow,relG+0.01,z0],[dShow+shW,relG+0.01,z0],[dShow+shW,relG+0.01,z1],[dShow,relG+0.01,z1], [120,112,92], 0.30);
  const meshCol = ok ? [46,139,87] : [178,56,59];
  const lineCol = ok ? 'rgba(30,96,60,.95)' : 'rgba(125,38,41,.95)';
  if (p.otype === 'crane'){
    // tower crane at dShow: lattice mast, jib toward the runway, apex = highest element at relG+H
    const mT = relG + p.H*0.74, apex = relG + p.H, mw = 1.6;
    const jl = Math.min(4 + p.H*1.1, 20), cjl = jl*0.38, jy = mT;
    quad([dShow-mw,relG,0-mw],[dShow-mw,mT,0-mw],[dShow-mw,mT,0+mw],[dShow-mw,relG,0+mw], meshCol, 0.5);
    quad([dShow+mw,relG,0-mw],[dShow+mw,mT,0-mw],[dShow+mw,mT,0+mw],[dShow+mw,relG,0+mw], meshCol, 0.5);
    quad([dShow-mw,relG,0],[dShow-mw,mT,0],[dShow+mw,mT,0],[dShow+mw,relG,0], meshCol, 0.35);
    const latN = Math.max(3, Math.round(p.H/1.2));
    for(let i=0;i<latN;i++){ const ya=relG+(mT-relG)*i/latN, yb=relG+(mT-relG)*(i+1)/latN;
      line([dShow-mw,ya,-mw],[dShow-mw,yb,mw], lineCol.replace('.95','.5'), 1);
      line([dShow-mw,yb,-mw],[dShow-mw,ya,mw], lineCol.replace('.95','.5'), 1);
    }
    line([dShow-jl,jy,0],[dShow+cjl,jy,0], lineCol, 3.4);                        // jib + counter-jib
    quad([dShow+cjl*0.55,jy+0.4,-1],[dShow+cjl,jy+0.4,-1],[dShow+cjl,jy-1.2,1],[dShow+cjl*0.55,jy-1.2,1], [90,95,100], 0.9); // counterweight
    line([dShow,apex,0],[dShow-jl,jy,0], lineCol.replace('.95','.6'), 1.3);       // tie bars
    line([dShow,apex,0],[dShow+cjl,jy,0], lineCol.replace('.95','.6'), 1.3);
    line([dShow,relG+p.H*0.74,0],[dShow,apex,0], lineCol, 3);                     // apex tower
    line([dShow-jl*0.7,jy,0],[dShow-jl*0.7,relG+Math.max(0.5,p.H*0.25),0], '#53585c', 1.2, [4,4]); // hook cable
  } else {
    quad([dShow,relG,z0],[dShow,relG+p.H,z0],[dShow,relG+p.H,z1],[dShow,relG,z1], meshCol, 0.45);
    for(let z=z0; z<z1; z+=10){
      line([dShow,relG,z],[dShow,relG+p.H,Math.min(z1,z+8)], lineCol.replace('.95','.25'), 1);
      line([dShow,relG+p.H,z],[dShow,relG,Math.min(z1,z+8)], lineCol.replace('.95','.25'), 1);
    }
    for(let z=z0; z<=z1; z+=48) line([dShow,relG,z],[dShow,relG+p.H,z], lineCol, 3);
    line([dShow,relG,z0],[dShow,relG,z1], lineCol, 2);
    line([dShow,relG+p.H,z0],[dShow,relG+p.H,z1], lineCol, 2.8);
    line([dShow,relG+p.H*0.52,z0],[dShow,relG+p.H*0.52,z1], lineCol.replace('.95','.55'), 1.4);
    line([dShow,relG+p.H+0.14,z0],[dShow,relG+p.H+0.14,z1], '#53585c', 1.6, [5,4]);
  }
  }
  // aircraft on the runway — animated: all clear = full take-off, return and landing cycle; red = held short, beacon flashing
  {
    const W2=22, FL=46, V=1/YEX, EG='rgba(105,112,121,.85)';
    const tsec = (performance.now()-ANIM0)/1000;
    let bz, h, pit=0, show=true, beacon=false, dir=1;
    if (okAll){
      const cyc = tsec % 20;
      if (cyc < 4){ const u=cyc/4; bz = 235 - 290*u*u; h = 1.6; }
      else if (cyc < 8){ const u=(cyc-4)/4; bz = -55 - 270*u; h = 1.6 + 40*u*u; pit = 0.06 + 0.05*Math.min(1, u*2); }
      else if (cyc < 11) show = false;
      else if (cyc < 15){ const u=(cyc-11)/4; dir=-1; bz = -325 + 270*u; h = 1.6 + 40*(1-u)*(1-u); pit = 0.03 + 0.05*(1-u); }
      else if (cyc < 19){ const u=(cyc-15)/4; dir=-1; const uu=2*u-u*u; bz = -55 + 290*uu; h = 1.6; }
      else show = false;
    } else {
      bz = 228 + 5*Math.sin(tsec*0.8); h = 1.6; beacon = (Math.floor(tsec*2.4)%2===0);
    }
    if (show){
      const P=(dx,dy,vz)=>[dx, h+dy - vz*pit, bz+vz*dir];
      if (h < 4) quad(P(-W2,-h+0.07,-5),P(W2,-h+0.07,-5),P(W2,-h+0.07,5),P(-W2,-h+0.07,5),[88,88,88],0.25);
      quad(P(0,0,2.8),P(-W2,0,7.5),P(-W2,0,2),P(0,0,-3),[221,225,231],1,EG,1.2);
      quad(P(0,0,2.8),P(W2,0,7.5),P(W2,0,2),P(0,0,-3),[205,210,217],1,EG,1.2);
      quad(P(-5,-1.2*V,5.2),P(-8.5,-1.2*V,5.2),P(-8.5,-1.2*V,1.2),P(-5,-1.2*V,1.2),[118,124,132],1,EG,1);
      quad(P(5,-1.2*V,5.2),P(8.5,-1.2*V,5.2),P(8.5,-1.2*V,1.2),P(5,-1.2*V,1.2),[118,124,132],1,EG,1);
      quad(P(0,-2.2*V,FL*0.44),P(0,2.5*V,FL*0.41),P(0,2.5*V,-FL*0.40),P(0,-2.2*V,-FL*0.45),[247,249,251],1,EG,1.2);
      quad(P(-2.4,1.2*V,FL*0.44),P(2.4,1.2*V,FL*0.44),P(2.4,1.2*V,-FL*0.40),P(-2.4,1.2*V,-FL*0.40),[238,241,246],1,EG,1);
      quad(P(-2.4,1.2*V,-FL*0.40),P(2.4,1.2*V,-FL*0.40),P(0,-0.5*V,-FL*0.56),P(0,-0.5*V,-FL*0.56),[233,237,242],1,EG,1);
      quad(P(0,1.6*V,FL*0.44),P(0,9*V,FL*0.57),P(0,9*V,FL*0.50),P(0,1.6*V,FL*0.36),[27,112,118],1,'rgba(16,70,76,.9)',1.2);
      quad(P(-9,1.8*V,FL*0.46),P(9,1.8*V,FL*0.46),P(6,1.8*V,FL*0.36),P(-6,1.8*V,FL*0.36),[221,225,231],1,EG,1);
      if (beacon) quad(P(-0.8,9.3*V,FL*0.52),P(0.8,9.3*V,FL*0.52),P(0.8,9.3*V,FL*0.49),P(-0.8,9.3*V,FL*0.49),[228,52,56],0.95);
    }
  }

  // ---- 5. OLS roof: transitional, capped by the inner horizontal plateau ----
  const segs=[];
  const xT = Math.min(xmax, ols.tEnd);
  segs.push([p.strip, 0, xT, allowRelAt(p,xT)]);
  if (xmax > ols.tEnd) segs.push([ols.tEnd, p.ihH, Math.min(xmax, ols.ihEnd), p.ihH]);
  if (xmax > ols.ihEnd) segs.push([ols.ihEnd, p.ihH, xmax, allowRelAt(p,xmax)]);
  for(const [xa,ha,xb,hb] of segs){
    const poly = clipPoly([toCam(xa,ha,-Zl),toCam(xb,hb,-Zl),toCam(xb,hb,Zl),toCam(xa,ha,Zl)]);
    if(poly.length<3) continue;
    const S=poly.map(toScr);
    const A1=P3(xa,ha,0), A2=P3(xb,hb,0);
    ctx.beginPath(); ctx.moveTo(S[0][0],S[0][1]);
    for(let i=1;i<S.length;i++) ctx.lineTo(S[i][0],S[i][1]);
    ctx.closePath();
    if(A1 && A2){
      const g2=ctx.createLinearGradient(A1[0],A1[1],A2[0],A2[1]);
      g2.addColorStop(0,'rgba(96,120,126,0.10)'); g2.addColorStop(1,'rgba(96,120,126,0.32)');
      ctx.fillStyle=g2;
    } else ctx.fillStyle='rgba(96,120,126,0.22)';
    ctx.fill(); ctx.strokeStyle='rgba(22,69,78,.85)'; ctx.lineWidth=2; ctx.stroke();
  }
  for(let x=p.strip+25; x<xmax; x+=25) line([x,allowRelAt(p,x),-Zl],[x,allowRelAt(p,x),Zl], 'rgba(22,69,78,.20)', 1);
  for(let z=-Zl+65; z<Zl; z+=65){
    let prev=[p.strip,0];
    for(const xq of [ols.tEnd, ols.ihEnd, xmax].filter(x=>x>p.strip && x<=xmax)){
      line([prev[0],prev[1],z],[xq,allowRelAt(p,xq),z], 'rgba(22,69,78,.20)', 1);
      prev=[xq,allowRelAt(p,xq)];
    }
  }
  // ---- 5b. approach & take-off climb sheets beyond the thresholds (batch mode) ----
  if (hasBatch && batchThr){
    const k = (z1 - z0)/Math.max(batchL, 1);           // scene units per metre along the runway
    for (const end of [{ze:z1, dir:1, rel:batchThr.a - p.cl}, {ze:z0, dir:-1, rel:batchThr.b - p.cl}]){
      const umax = Math.min(1500, (Zt - 14 - Math.abs(end.ze))/k);
      if (umax < APP.dist + 60) continue;
      const seg = (umax - APP.dist)/5;
      for (let i2=0; i2<5; i2++){
        const ua = APP.dist + i2*seg, ub = ua + seg;
        const ya = end.rel + APP.g1*(ua - APP.dist), yb = end.rel + APP.g1*(ub - APP.dist);
        const ha = APP.inner + APP.div*(ua - APP.dist), hb = APP.inner + APP.div*(ub - APP.dist);
        const za = end.ze + end.dir*ua*k, zb = end.ze + end.dir*ub*k;
        quad([-ha,ya,za],[ha,ya,za],[hb,yb,zb],[-hb,yb,zb], [96,120,126], 0.16, 'rgba(22,69,78,.45)', 1);
      }
      line([0, end.rel, end.ze + end.dir*APP.dist*k], [0, end.rel + APP.g1*(umax - APP.dist), end.ze + end.dir*umax*k], 'rgba(22,69,78,.35)', 1, [6,5]);
    }
  }
  // penetration slice above the surface
  if(!hasBatch && !e.inside && e.pen>0 && !farClip){
    const surfAtD=allowRelAt(p, dShow);
    const pen = clipPoly([toCam(dShow,surfAtD,z0),toCam(dShow,relG+p.H,z0),toCam(dShow,relG+p.H,z1),toCam(dShow,surfAtD,z1)]);
    if(pen.length>=3){
      const S=pen.map(toScr);
      ctx.beginPath(); ctx.moveTo(S[0][0],S[0][1]);
      for(let i=1;i<S.length;i++) ctx.lineTo(S[i][0],S[i][1]);
      ctx.closePath();
      ctx.fillStyle='rgba(178,56,59,.55)'; ctx.fill(); ctx.strokeStyle='#7d1f22'; ctx.lineWidth=2.5; ctx.stroke();
    }
  }
  // ---- 6. labels (with halo; skipped when behind the camera) ----
  const t=T();
  function label(txt, P, col, dy){
    if(!P) return;
    ctx.font='bold 14px Tahoma'; ctx.textAlign='center';
    ctx.lineWidth=3.5; ctx.strokeStyle='rgba(255,255,255,.78)'; ctx.strokeText(txt, P[0], P[1]+(dy||-6));
    ctx.fillStyle=col; ctx.fillText(txt, P[0], P[1]+(dy||-6));
  }
  label(t.rwy, P3(0,0.1,Zl*0.42), '#2d3133');
  label(t.stripLbl+' '+p.strip, P3(p.strip,0.1,Zl*0.55), '#0e6a70', -8);
  label(t.surf, P3(xmax*0.93,(xmax*0.93-p.strip)/p.slope,-Zl*0.25), '#16454E', -8);
  if (hasBatch){
    label(thrName(0), P3(0, 0.12, z1 - 16), '#2d3133', -4);
    label(thrName(1), P3(0, 0.12, z0 + 16), '#2d3133', -4);
    if (batchThr){
      const k2 = (z1 - z0)/Math.max(batchL, 1);
      const um = Math.min(1500, (Zt - 14 - Math.abs(z1))/k2);
      if (um > APP.dist + 60)
        label(t.b_endSurf, P3(0, (batchThr.a - p.cl) + APP.g1*(um*0.55 - APP.dist) + 2, z1 + um*0.55*k2), '#16454E', -6);
    }
    for(let i=0;i<batchRows.length;i++){
      const r=batchRows[i], sel=(i===batchSel);
      const bad=(r.e.inside || r.e.pen>0);
      const zz = Math.max(-(Zt-14), Math.min(Zt-14, (Zl*0.92) - (r.s/Math.max(batchL,1))*(2*Zl*0.92)));
      const xx = Math.min(r.d, 540);
      const col = bad ? '#8c2a2d' : (r.nocov ? '#8a650f' : '#1d6b43');
      const txt = sel
        ? (r.nocov ? r.pt.id+' — '+t.b_nocov
          : r.pt.id+' — '+(r.e.inside ? t.inside : (r.e.pen>0 ? t.pen+r.e.pen.toFixed(2)+t.m : t.marg+(-r.e.pen).toFixed(2)+t.m)))
        : '‎'+r.pt.id+(r.nocov ? ' ⚠' : (r.e.inside ? ' ✗' : (r.e.pen>0 ? ' ✗'+r.e.pen.toFixed(1) : ' +'+(-r.e.pen).toFixed(1))));
      label(txt, P3(xx, r.relg + r.H + 0.7, zz), col, sel?-10:-5);
    }
  } else {
  label((p.otype==='crane'?t.craneLbl:t.fence)+' — '+p.d.toFixed(0)+(farClip?' · '+t.far3d:''), P3(dShow, relG+p.H+0.8, -Zl*0.45), ok?'#1d6b43':'#8c2a2d');
  }

  // ---- 7. true-scale plan inset: the fence's real shape, as on the survey drawing ----
  if (hasBatch){
    const IW = Math.min(330, W*0.30), IH = Math.min(210, Hc*0.40), ix = 12, iy = 12;
    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = 'rgba(22,69,78,.85)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(ix, iy, IW, IH, 10); else ctx.rect(ix, iy, IW, IH);
    ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
    const prs = batchRows;
    let aMin = Math.min(0, ...prs.map(r=>r.s)), aMax = Math.max(batchL, ...prs.map(r=>r.s));
    let cMin = Math.min(0, ...prs.map(r=>r.cx)), cMax = Math.max(0, ...prs.map(r=>r.cx));
    const mpad = 0.06*Math.max(aMax-aMin, cMax-cMin);
    aMin-=mpad; aMax+=mpad; cMin-=mpad; cMax+=mpad;
    const S = Math.min((IW-20)/(aMax-aMin), (IH-32)/(cMax-cMin));
    const ox = ix+10 + ((IW-20) - S*(aMax-aMin))/2;
    const oy = iy+24 + ((IH-32) - S*(cMax-cMin))/2;
    const MX = (a,c)=>[ ox + (a-aMin)*S, oy + (c-cMin)*S ];
    // runway slab on the centreline
    const [r1x,r1y] = MX(0,0), [r2x,r2y] = MX(batchL,0);
    ctx.strokeStyle = '#55585c'; ctx.lineWidth = Math.max(3, 46*S);
    ctx.beginPath(); ctx.moveTo(r1x,r1y); ctx.lineTo(r2x,r2y); ctx.stroke();
    // threshold designators at each end of the slab
    ctx.font = 'bold 10px Tahoma'; ctx.textAlign = 'center'; ctx.fillStyle = '#16454E';
    ctx.fillText(thrName(0), r1x - 17, r1y - 7);
    ctx.fillText(thrName(1), r2x + 17, r2y - 7);
    // strip edges (dashed teal) at ±strip half-width
    ctx.strokeStyle = 'rgba(31,154,160,.8)'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
    for (const sg of [p.strip, -p.strip]){
      const [e1x,e1y]=MX(0,sg), [e2x,e2y]=MX(batchL,sg);
      ctx.beginPath(); ctx.moveTo(e1x,e1y); ctx.lineTo(e2x,e2y); ctx.stroke();
    }
    ctx.setLineDash([]);
    // fence polyline, coloured per segment verdict
    for (let i=0;i<prs.length-1;i++){
      const a=prs[i], b2=prs[i+1];
      const bad = (a.e.inside||a.e.pen>0||b2.e.inside||b2.e.pen>0);
      ctx.strokeStyle = bad ? '#B2383B' : '#2E8B57'; ctx.lineWidth = 2.2;
      const [x1,y1]=MX(a.s,a.cx), [x2,y2]=MX(b2.s,b2.cx);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }
    // point dots
    for (let i=0;i<prs.length;i++){
      const r=prs[i], bad=(r.e.inside||r.e.pen>0);
      const [px2,py2]=MX(r.s,r.cx);
      ctx.beginPath(); ctx.arc(px2,py2, i===batchSel?4.5:2.8, 0, 6.3);
      ctx.fillStyle = bad ? '#B2383B' : (r.nocov ? '#a97a17' : '#2E8B57'); ctx.fill();
      if (i===batchSel){ ctx.strokeStyle='#16454E'; ctx.lineWidth=1.5; ctx.stroke(); }
    }
    ctx.font = 'bold 12px Tahoma'; ctx.textAlign = 'center';
    ctx.fillStyle = '#16454E'; ctx.fillText(t.b_plan, ix+IW/2, iy+16);
    ctx.restore();
  }
}

// ================= interaction =================
const cvEl = document.getElementById('cv');
let dragging=false, px=0, py=0;
function clampCam(){
  if(cam.mode==='walk'){
    cam.wpitch = Math.max(-0.6, Math.min(1.2, cam.wpitch));
    cam.wx = Math.max(-200, Math.min(900, cam.wx));
    cam.wz = Math.max(-440, Math.min(440, cam.wz));
  } else {
    cam.pitch = Math.max(0.05, Math.min(1.55, cam.pitch));
    cam.dist  = Math.max(760, Math.min(1700, cam.dist));
  }
}
function walkMove(d){
  cam.wx += Math.sin(cam.wyaw)*d;
  cam.wz += Math.cos(cam.wyaw)*d;
}
cvEl.addEventListener('pointerdown', ev=>{ if(view!=='3d')return; ev.preventDefault();
  dragging=true; px=ev.clientX; py=ev.clientY;
  try{ cvEl.setPointerCapture(ev.pointerId); }catch(e){} });
cvEl.addEventListener('pointermove', ev=>{ if(!dragging||view!=='3d')return; ev.preventDefault();
  const dx=(ev.clientX-px), dy=(ev.clientY-py);
  if(cam.mode==='walk'){ cam.wyaw += dx*0.004; cam.wpitch += dy*0.004; }
  else { cam.yaw += dx*0.006; cam.pitch += dy*0.006; }
  clampCam(); px=ev.clientX; py=ev.clientY; update(); });
['pointerup','pointercancel','lostpointercapture'].forEach(n=> cvEl.addEventListener(n, ()=>{ dragging=false; }));
window.addEventListener('pointerup', ()=>{ dragging=false; });
cvEl.addEventListener('wheel', ev=>{ if(view!=='3d')return; ev.preventDefault();
  if(cam.mode==='walk') walkMove(-ev.deltaY*0.12);
  else cam.dist += ev.deltaY*0.8;
  clampCam(); update(); }, {passive:false});

// on-screen controls: work everywhere, including viewers that swallow drag gestures
const ORBIT_HOME = { yaw:-0.78, pitch:0.52, dist:860 };
function orbitStep(act){
  const w = cam.mode==='walk';
  if(act==='left') { if(w) cam.wyaw -= 0.10; else cam.yaw -= 0.12; }
  if(act==='right'){ if(w) cam.wyaw += 0.10; else cam.yaw += 0.12; }
  if(act==='up')   { if(w) cam.wpitch -= 0.06; else cam.pitch += 0.07; }
  if(act==='down') { if(w) cam.wpitch += 0.06; else cam.pitch -= 0.07; }
  if(act==='in')   { if(w) walkMove(22); else cam.dist -= 70; }
  if(act==='out')  { if(w) walkMove(-22); else cam.dist += 70; }
  if(act==='reset'){
    cam.home = ((cam.home||0)+1)%4;
    if(cam.home===0){ cam.mode='orbit'; cam.yaw=ORBIT_HOME.yaw; cam.pitch=ORBIT_HOME.pitch; cam.dist=ORBIT_HOME.dist; }
    if(cam.home===1){ cam.mode='walk'; cam.wx=0; cam.wz=0;    cam.wyaw=1.5708;  cam.wpitch=0.06; } // mid-runway, facing fence
    if(cam.home===2){ cam.mode='walk'; cam.wx=0; cam.wz=-285; cam.wyaw=0;       cam.wpitch=0.05; } // S threshold, looking down the runway
    if(cam.home===3){ cam.mode='walk'; cam.wx=0; cam.wz=285;  cam.wyaw=3.1416;  cam.wpitch=0.05; } // N threshold, looking back
  }
  clampCam(); update();
}
(function(){
  let hold=null;
  document.querySelectorAll('#orbit button').forEach(btn=>{
    const act = btn.dataset.act;
    btn.addEventListener('click', ()=>orbitStep(act));
    btn.addEventListener('pointerdown', ev=>{ ev.preventDefault();
      if(act==='reset') return;
      hold = setInterval(()=>orbitStep(act), 90); });
    ['pointerup','pointerleave','pointercancel'].forEach(n=>
      btn.addEventListener(n, ()=>{ if(hold){ clearInterval(hold); hold=null; } }));
  });
})();

['cl','g','slope','hgt','stripCustom','ihh','ihe','otype'].forEach(id=>{
  document.getElementById(id).addEventListener('input', update);
});
document.getElementById('dist').addEventListener('input', ()=>{
  document.getElementById('distNum').value = document.getElementById('dist').value;
  update();
});
document.getElementById('distNum').addEventListener('input', ()=>{
  const v = parseFloat(document.getElementById('distNum').value)||0;
  document.getElementById('dist').value = Math.min(v, 600);
  update();
});
document.getElementById('strip').addEventListener('input', ()=>{
  document.getElementById('stripCustom').style.display =
    (document.getElementById('strip').value==='custom') ? 'block' : 'none';
  update();
});
document.getElementById('bFile').addEventListener('change', async ev=>{
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  const buf = await f.arrayBuffer();
  const head = new Uint8Array(buf.slice(0, 512));
  const sig = String.fromCharCode(...head.subarray(0, 4));
  if (sig.startsWith('PK')){                      // zip container: xlsx or docx
    let txt = null;
    try { txt = await readXlsx(buf); }
    catch(e){ try { txt = await readDocx(buf); } catch(e2){} }
    if (txt === null){ showBatchMsg(T().b_err_xlsx, true); return; }
    document.getElementById('bData').value = txt; runBatch();
    return;
  }
  if (sig === '%PDF' || head.includes(0)){        // pdf or other binary
    showBatchMsg(T().b_err_type, true); return;
  }
  const txt = new TextDecoder().decode(buf);
  if ((txt.slice(0, 2000).match(/\uFFFD/g) || []).length > 4){
    showBatchMsg(T().b_err_type, true); return;
  }
  document.getElementById('bData').value = txt; runBatch();
});

// ---- minimal .xlsx reader: zip central directory + deflate-raw + sheet XML, no libraries ----
async function unzipEntry(buf, name){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('zip');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const td = new TextDecoder();
  for (let k = 0; k < count; k++){
    if (dv.getUint32(off, true) !== 0x02014b50) throw new Error('cd');
    const method = dv.getUint16(off + 10, true);
    const csize  = dv.getUint32(off + 20, true);
    const nlen = dv.getUint16(off + 28, true), elen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true);
    const lho  = dv.getUint32(off + 42, true);
    const ename = td.decode(u8.subarray(off + 46, off + 46 + nlen));
    if (ename === name){
      const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lelen;
      const data = u8.subarray(start, start + csize);
      if (method === 0) return td.decode(data);
      const ds = new DecompressionStream('deflate-raw');
      const out = await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();
      return td.decode(out);
    }
    off += 46 + nlen + elen + clen;
  }
  return null;
}
async function readXlsx(buf){
  // first worksheet
  let sheet = null;
  for (let n = 1; n <= 4 && !sheet; n++) sheet = await unzipEntry(buf, 'xl/worksheets/sheet' + n + '.xml');
  if (!sheet) throw new Error('sheet');
  const ssXml = await unzipEntry(buf, 'xl/sharedStrings.xml');
  const shared = [];
  if (ssXml){
    const doc = new DOMParser().parseFromString(ssXml, 'application/xml');
    for (const si of doc.getElementsByTagName('si')){
      let s = ''; for (const t of si.getElementsByTagName('t')) s += t.textContent;
      shared.push(s);
    }
  }
  const doc = new DOMParser().parseFromString(sheet, 'application/xml');
  const lines = [];
  for (const row of doc.getElementsByTagName('row')){
    const cells = [];
    for (const c of row.getElementsByTagName('c')){
      const t = c.getAttribute('t');
      let v = '';
      if (t === 'inlineStr'){ for (const tt of c.getElementsByTagName('t')) v += tt.textContent; }
      else {
        const vEl = c.getElementsByTagName('v')[0];
        v = vEl ? vEl.textContent : '';
        if (t === 's') v = shared[parseInt(v, 10)] ?? '';
      }
      cells.push(String(v).replace(/[\s,،;|]+/g, ' ').trim());
    }
    if (cells.some(x => x !== '')) lines.push(cells.join(', '));
  }
  if (!lines.length) throw new Error('empty');
  return lines.join('\n');
}
async function readDocx(buf){
  const xml = await unzipEntry(buf, 'word/document.xml');
  if (!xml) throw new Error('docx');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const txtOf = el => { let s = ''; for (const t of el.getElementsByTagNameNS('*', 't')) s += t.textContent; return s; };
  const lines = [];
  const tbls = doc.getElementsByTagNameNS('*', 'tbl');
  if (tbls.length){
    for (const tbl of tbls) for (const tr of tbl.getElementsByTagNameNS('*', 'tr')){
      const cells = [];
      for (const tc of tr.getElementsByTagNameNS('*', 'tc'))
        cells.push(txtOf(tc).replace(/[\s,،;|]+/g, ' ').trim());
      if (cells.some(x => x !== '')) lines.push(cells.join(', '));
    }
  } else {
    for (const p of doc.getElementsByTagNameNS('*', 'p')){
      const s = txtOf(p).trim(); if (s) lines.push(s);
    }
  }
  if (!lines.length) throw new Error('empty');
  return lines.join('\n');
}
